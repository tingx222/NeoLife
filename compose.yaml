services:
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    hostname: hmdp-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: hmdp
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Set RABBIT_PASSWORD in local .env}
      RABBITMQ_DEFAULT_VHOST: hmdp
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  rabbit-data:
