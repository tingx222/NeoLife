<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>黑马点评</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">

  <link href="./css/shop-list.css" rel="stylesheet">
  <link href="./css/main.css" rel="stylesheet">

  <style type="text/css">
    #app { display:flex; flex-direction:column; }
    .header,.sort-bar { flex-shrink:0; }
    .shop-list { flex:1; height:auto; min-height:0; }
    .list-status { padding:16px; text-align:center; color:#777; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
    <div class="header-title">{{typeName}}</div>
    <div class="header-search">
      <i class="el-icon-search"></i>
    </div>
  </div>
  <div style="padding:10px;background:#fff7ef;font-size:13px">
    {{locationLabel}} · 半径5公里
    <button @click="locate">使用我的位置</button>
  </div>
  <div class="sort-bar">
    <div class="sort-item">
      <el-dropdown trigger="click" @command="handleCommand">
      <span class="el-dropdown-link">
        {{typeName}}<i class="el-icon-arrow-down el-icon--right"></i>
      </span>
        <el-dropdown-menu slot="dropdown">
          <el-dropdown-item v-for="t in types" :key="t.id" :command="t">
            {{t.name}}
          </el-dropdown-item>
        </el-dropdown-menu>
      </el-dropdown>
    </div>
    <div class="sort-item" @click="sortAndQuery('')">
      距离 <i class="el-icon-arrow-down el-icon--right"></i>
    </div>
    <div class="sort-item" @click="sortAndQuery('comments')">
      人气 <i class="el-icon-arrow-down el-icon--right"></i>
    </div>
    <div class="sort-item" @click="sortAndQuery('score')">
      评分 <i class="el-icon-arrow-down el-icon--right"></i>
    </div>
  </div>
  <div class="shop-list" ref="shopList" @scroll="onScroll">
    <div class="shop-box" v-for="s in shops" :key="s.id" @click="toDetail(s.id)">
      <div class="shop-img"><img :src="s.images" alt=""></div>
      <div class="shop-info">
        <div class="shop-title shop-item">{{s.name}}</div>
        <div class="shop-rate shop-item" >
          <el-rate
              disabled v-model="s.score/10"
              text-color="#F63"
              show-score
          ></el-rate>
          <span>{{s.comments}}条</span>
        </div>
        <div class="shop-area shop-item">
          <span>{{s.area}}</span>
          <span v-if="s.distance">{{s.distance < 1000 ? s.distance.toFixed(1) + 'm' : (s.distance/1000).toFixed(1) + 'km'}}</span>
        </div>
        <div class="shop-avg shop-item">￥{{s.avgPrice}}/人</div>
        <div class="shop-address shop-item">
          <i class="el-icon-map-location"></i>
          <span>{{s.address}}</span>
        </div>
      </div>
    </div>
    <div class="list-status">
      <span v-if="loading">正在加载商户…</span>
      <template v-else-if="loadError">{{loadError}} <button @click="queryShops">重试</button></template>
      <span v-else-if="finished">{{shops.length ? '已显示全部附近商户' : '当前分类和位置范围内暂无商户'}}</span>
      <button v-else @click="queryShops">加载更多商户</button>
    </div>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      util,
      isReachBottom: false,
      loading: false,
      finished: false,
      loadError: '',
      queryVersion: 0,
      types: [], // 类型列表
      shops: [], // 商店列表
      typeName: "",
      locationLabel: "杭州示例坐标",
      params:{
        typeId: 0,
        current: 1,
        sortBy: "",
        x: 120.149993, // 经度
        y: 30.334229 // 纬度
      }
    },
    created() {
      // 获取参数
      this.params.typeId = util.getUrlParam("type");
      this.typeName = util.getUrlParam("name");
      // 查询类型
      this.queryTypes();
      // 查询商店
      this.queryShops();
    },
    methods: {
      locate() {
        if(!navigator.geolocation){this.$message.error('浏览器不支持定位');return;}
        navigator.geolocation.getCurrentPosition(position => {
          this.params.x=position.coords.longitude;this.params.y=position.coords.latitude;
          this.locationLabel='当前位置';this.resetShops();
        }, () => this.$message.error('定位未成功，继续使用杭州示例坐标'), {timeout:10000});
      },
      queryTypes() {
        axios.get("/shop-type/list")
          .then(({data}) => {
            this.types = data;
          })
          .catch(err => {
            console.log(err);
            this.$message.error(err)
          })
      },
      queryShops() {
        if(this.loading || this.finished)return;
        this.loading=true;this.loadError='';
        const version=++this.queryVersion;
        axios.get("/shop/of/type", {
            params: Object.assign({}, this.params)
          })
          .then(({data}) => {
            if(version!==this.queryVersion)return;
            const records=data || [];
            records.forEach(s => s.images = (s.images || '').split(',')[0]);
            this.shops = this.shops.concat(records);
            this.finished=records.length<5;
            this.params.current++;
          })
          .catch(err => {
            if(version===this.queryVersion)this.loadError=String(err);
          }).finally(() => {
            if(version!==this.queryVersion)return;
            this.loading=false;
            this.$nextTick(() => {
              const list=this.$refs.shopList;
              if(!this.loadError && !this.finished && list && list.scrollHeight<=list.clientHeight+1)this.queryShops();
            });
          });
      },
      resetShops() {
        this.queryVersion++;this.loading=false;this.finished=false;this.loadError='';
        this.params.current=1;this.shops=[];this.queryShops();
      },
      handleCommand(t) {
        location.href = "/shop-list.html?type="+t.id+"&name="+t.name;
      },
      sortAndQuery(sortBy) {
        this.params.sortBy = sortBy;
        this.resetShops();
      },
      goBack() {
        history.back();
      },
      toDetail(id) {
        location.href = "/shop-detail.html?id="+id
      },
      onScroll(e) {
        let scrollTop = e.target.scrollTop;
        let offsetHeight = e.target.offsetHeight;
        let scrollHeight = e.target.scrollHeight;
        if(scrollTop + offsetHeight >= scrollHeight - 80)this.queryShops();
      },
    }
  })
</script>
</body>
</html>
